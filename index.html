<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Abhinav Jadhav | Software Developer & Product Builder</title>
    <meta name="description" content="Portfolio of Abhinav Jadhav — Full-Stack and IoT Developer at CHRIST University, Bengaluru." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        var theme = 'dark';
        try {
          theme = localStorage.getItem('portfolio_theme') || 'dark';
        } catch (e) {
          theme = 'dark';
        }
        document.documentElement.classList.toggle('dark', theme !== 'light');
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
